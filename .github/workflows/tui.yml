name: tui

# Terminal okuyucu: her değişiklikte biçim, clippy, test ve release derlemesi.
# tui-vX.Y.Z etiketi Linux ikilisini GitHub Releases'ta yayınlar (etiketlerde yol süzgeci uygulanmaz).
on:
  push:
    branches: ["**"]
    tags: ["tui-v*"]
    paths:
      - "crates/tui/**"
      - "crates/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/tui.yml"
  pull_request:
    paths:
      - "crates/tui/**"
      - "crates/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/tui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 24.04 (glibc 2.39): ikili daha yeni dağıtımlarda (Arch, Fedora, ...) da çalışır
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      # Etiket derlemesinde önbellek yok: başka dalın yazdığı önbellek yayına sızmasın
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Etiket ile sürüm aynı mı
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version *= *"\(.*\)"$/\1/p' crates/tui/Cargo.toml | head -1)
          if [ "tui-v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::etiket $GITHUB_REF_NAME, crates/tui sürümü $v"
            exit 1
          fi
      - run: cargo fmt -p readcrab_tui -- --check
      # Çekirdeğin bilinen uyarıları (android.yml'de de hata sayılmaz) burada da görünür;
      # yalnız crates/tui altındaki uyarılar işi düşürür.
      - name: clippy
        shell: bash
        run: |
          cargo clippy --locked -p readcrab_tui --all-targets --message-format=short 2>&1 | tee clippy.log
          if grep -E '^crates/tui/' clippy.log; then
            echo "::error::readcrab_tui clippy uyarısı var"
            exit 1
          fi
      - run: cargo test --locked -p readcrab_tui
      - run: cargo build --locked --release -p readcrab_tui
      - name: Paket
        shell: bash
        run: |
          v=$(sed -n 's/^version *= *"\(.*\)"$/\1/p' crates/tui/Cargo.toml | head -1)
          name="readcrab-tui-$v-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/readcrab-tui LICENSE "dist/$name/"
          strip "dist/$name/readcrab-tui"
          "dist/$name/readcrab-tui" --version
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readcrab-tui-x86_64-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/tui-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: readcrab-tui-x86_64-linux
          path: dist
      # --latest=false: "Latest" rozeti Android sürümünde kalsın
      - name: GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --latest=false \
            --title "Terminal okuyucu ${GITHUB_REF_NAME#tui-}" \
            --notes "Linux x86_64 terminal okuyucu. Arşivi açıp \`readcrab-tui\` dosyasını PATH'teki bir dizine (ör. \`~/.local/bin\`) koyun. Doğrulama: \`sha256sum -c *.sha256\`."
