name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: "[ -f Cargo.lock ] || cargo generate-lockfile"
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: for f in web/*.js; do node --check "$f"; done
      - run: node web/theme.test.mjs
      - run: cargo test --locked

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f Cargo.lock
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: kavita-rs:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha
      - run: bash scripts/smoke.sh kavita-rs:ci

  e2e:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f Cargo.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: kavita-rs:ci
          platforms: linux/amd64
          cache-from: type=gha
      - run: |
          docker volume create e2e-data
          mkdir /tmp/e2e-books
          python3 -I scripts/e2e/make_books.py /tmp/e2e-books
          docker run -d --name e2e -p 3435:3435 -v e2e-data:/data -v /tmp/e2e-books:/books:ro kavita-rs:ci
          for i in $(seq 1 30); do
            if [ "$(curl -fsS http://127.0.0.1:3435/health 2>/dev/null || true)" = "ok" ]; then
              break
            fi
            sleep 1
          done
          [ "$(curl -fsS http://127.0.0.1:3435/health)" = "ok" ]
      - run: |
          cd scripts/e2e
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: scripts/e2e/screenshots
          retention-days: 14
      - if: failure()
        run: docker logs e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: scripts/e2e/test-results
      - if: always()
        run: |
          docker rm -f e2e || true
          docker volume rm e2e-data || true

  publish:
    needs: [image, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/mustafabayramguven/kavita-rs:latest
          platforms: linux/amd64
          cache-from: type=gha
