name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: "[ -f Cargo.lock ] || cargo generate-lockfile"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-lock
          path: Cargo.lock
      - run: cargo fmt -p readcrab -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: for f in web/*.js; do node --check "$f"; done
      - run: node web/theme.test.mjs
      - run: node web/calc.test.mjs
      - run: cargo test --locked

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: test -f Cargo.lock
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: false
          load: true
          tags: readcrab:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha
      - run: bash scripts/smoke.sh readcrab:ci

  e2e:
    needs: image
    # Playwright 1.55 ubuntu 26.04'te chromium kuramıyor (ubuntu-latest 26.04'e geçti)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: test -f Cargo.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: false
          load: true
          tags: readcrab:ci
          platforms: linux/amd64
          cache-from: type=gha
      - run: |
          docker volume create e2e-data
          mkdir /tmp/e2e-books
          python3 -I scripts/e2e/make_books.py /tmp/e2e-books
          docker run -d --name e2e -p 3435:3435 -v e2e-data:/data -v /tmp/e2e-books:/books:ro readcrab:ci
          for i in $(seq 1 30); do
            if [ "$(curl -fsS http://127.0.0.1:3435/health 2>/dev/null || true)" = "ok" ]; then
              break
            fi
            sleep 1
          done
          [ "$(curl -fsS http://127.0.0.1:3435/health)" = "ok" ]
      - run: |
          cd scripts/e2e
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-screenshots
          path: scripts/e2e/screenshots
          retention-days: 14
      - if: failure()
        run: docker logs e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-test-results
          path: scripts/e2e/test-results
      - if: always()
        run: |
          docker rm -f e2e || true
          docker volume rm e2e-data || true

  # Her mimari kendi native runner'ında derlenir (QEMU yok), smoke testten geçer,
  # etiketsiz olarak digest ile ghcr'a itilir; merge işi tek bir :latest manifest'i yapar.
  publish:
    needs: [image, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            cache: buildkit          # image işinin yazdığı varsayılan gha önbelleği
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            cache: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: test -f Cargo.lock
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Derle (yerel)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: false
          load: true
          tags: readcrab:${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
      - name: Smoke test (${{ matrix.arch }})
        run: bash scripts/smoke.sh "readcrab:${{ matrix.arch }}"
      - name: Digest ile it
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/mustafabayramguven/readcrab,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache }}
      - name: Digest'i kaydet
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: amd64 + arm64 -> :latest
        working-directory: ${{ runner.temp }}/digests
        run: |
          img=ghcr.io/mustafabayramguven/readcrab
          [ "$(ls | wc -l)" = 2 ] || { echo "::error::2 digest bekleniyordu"; ls; exit 1; }
          docker buildx imagetools create -t "$img:latest" $(printf "$img@sha256:%s " *)
          docker buildx imagetools inspect "$img:latest"
          docker buildx imagetools inspect "$img:latest" | grep -q 'linux/arm64'
          docker buildx imagetools inspect "$img:latest" | grep -q 'linux/amd64'
