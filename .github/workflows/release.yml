name: release

# v* etiketi: imzalı release APK'yı derler ve GitHub Releases'ta yayınlar.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Etiket ile versionName aynı mı
        run: |
          v=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' android/app/build.gradle.kts)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::etiket $GITHUB_REF_NAME, versionName $v"
            exit 1
          fi
      # İmzalı derlemede önbellek yok: başka dalın yazdığı önbellek release'e sızmasın
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.89.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Rust çekirdeği (3 ABI)
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs \
            build --locked --release -p readcrab_core
      - name: UniFFI Kotlin binding
        run: |
          cargo run --locked -p readcrab_core --features cli --bin uniffi-bindgen -- generate \
            --library android/app/src/main/jniLibs/arm64-v8a/libreadcrab_core.so \
            --language kotlin --no-format \
            --out-dir android/app/build/generated/uniffi/kotlin
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: İmza anahtarı
        env:
          RC_KEYSTORE_B64: ${{ secrets.RC_KEYSTORE_B64 }}
          RC_KEYSTORE_PASSWORD: ${{ secrets.RC_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RC_KEYSTORE_B64" ] || [ -z "$RC_KEYSTORE_PASSWORD" ]; then
            echo "::error::RC_KEYSTORE_B64 / RC_KEYSTORE_PASSWORD secret'ları tanımlı değil"
            exit 1
          fi
          umask 077
          printf '%s' "$RC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          keytool -list -storetype pkcs12 -keystore "$RUNNER_TEMP/release.p12" \
            -storepass:env RC_KEYSTORE_PASSWORD -alias readcrab > /dev/null
          echo "RC_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: İmzalı release APK
        working-directory: android
        env:
          RC_KEYSTORE_PASSWORD: ${{ secrets.RC_KEYSTORE_PASSWORD }}
          RC_KEY_ALIAS: readcrab
        run: gradle --no-daemon assembleRelease
      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - name: İmzayı doğrula, dağıtım dosyaları
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          name="readcrab-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/certs.txt"
          mkdir dist
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | sed 's/.*: //' > dist/cert-sha256.txt
          [ -s dist/cert-sha256.txt ]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Yazma yetkisi yalnız burada; bu iş imza anahtarını hiç görmez
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="readcrab-${GITHUB_REF_NAME}.apk"
          cert=$(cat dist/cert-sha256.txt)
          sum=$(cut -d' ' -f1 "dist/$name.sha256")
          cat > notes.md <<EOF
          ## Android kurulumu

          1. \`$name\` dosyasını telefona indirip açın (bilinmeyen kaynaklardan yüklemeye izin vermeniz istenebilir).
          2. Daha önce GitHub Actions'tan **debug** APK kurduysanız önce onu kaldırın: imza anahtarı farklı olduğu için üstüne kurulamaz.
          3. Sunucu adresini \`https://\` ile girin. \`http://\` yalnız yerel ağdaki sunucularda çalışır.

          Bundan sonraki sürümler aynı anahtarla imzalanır ve kaldırmadan üstüne güncellenir.

          ## Doğrulama

          - APK SHA-256: \`$sum\`
          - İmza sertifikası SHA-256: \`$cert\`

          \`apksigner verify --print-certs $name\` çıktısındaki sertifika özeti yukarıdakiyle aynı olmalıdır.
          EOF
          gh release create "$GITHUB_REF_NAME" "dist/$name" "dist/$name.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ReadCrab $GITHUB_REF_NAME" --notes-file notes.md
