[package]
name = "readcrab_tui"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "ReadCrab terminal okuyucusu (ratatui)"

[[bin]]
name = "readcrab-tui"
path = "src/main.rs"

[dependencies]
readcrab_core = { path = "../core" }
ratatui       = { version = "=0.29.0", default-features = false, features = ["crossterm", "underline-color"] }
ratatui-image = { version = "=9.0.0", default-features = false, features = ["crossterm"] }
image         = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
serde         = { version = "=1.0.219", features = ["derive"] }
serde_json    = "=1.0.143"
unicode-width = "0.2"
libc          = "0.2"
